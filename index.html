<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student System</title>
</head>
<body>

  <h2>Add New Student</h2>
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <button onclick="addStudent()">Add Student</button>

  <hr>

  <h2>Register Course for Student</h2>
  <select id="studentSelect">
    <option value="">-- Select a Student --</option>
  </select>
  <input id="courseName" placeholder="Course Name">
  <button onclick="registerCourse()">Register Course</button>

  <hr>

  <h2>Registered Students & Courses</h2>
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      </tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  
  <script>
    // Replace with your actual Supabase credentials
    const supabaseClient = supabase.createClient("https://rdjnflniomehmkdzowzv.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkam5mbG5pb21laG1rZHpvd3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTI1ODMsImV4cCI6MjA5Mzk4ODU4M30.FtUJP2oeeoJHU7tnkbJUrdq_laSg2pHndefnW5RQYWk");

    // Automatically load data when the page opens
    window.onload = loadStudents;

    // 1. ADD STUDENT RECORD
    async function addStudent() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      if (!name || !email) {
        alert("Please fill in both name and email.");
        return;
      }

      await supabaseClient
        .from("students")
        .insert([{ name, email, course: null }]);

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      loadStudents();
    }

    // 2. REGISTER COURSE (Quick assignment via dropdown)
    async function registerCourse() {
      const studentId = document.getElementById("studentSelect").value;
      const courseName = document.getElementById("courseName").value;

      if (!studentId || !courseName) {
        alert("Please select a student and enter a course name.");
        return;
      }

      await supabaseClient
        .from("students")
        .update({ course: courseName })
        .eq("id", studentId); 

      document.getElementById("courseName").value = "";
      loadStudents();
    }

    // 3. UPDATE COURSE DIALOG (Triggered from Table Row)
    async function updateCourse(studentId, currentCourse) {
      const newCourse = prompt("Enter new course name:", currentCourse || "");
      
      // If user cancels or types nothing, do nothing
      if (newCourse === null) return;

      await supabaseClient
        .from("students")
        .update({ course: newCourse || null }) // Sets to null if string is empty
        .eq("id", studentId);

      loadStudents();
    }

    // 4. DELETE RECORD (Triggered from Table Row)
    async function deleteStudent(studentId, studentName) {
      const confirmDelete = confirm(`Are you sure you want to delete ${studentName}?`);
      
      if (!confirmDelete) return;

      await supabaseClient
        .from("students")
        .delete()
        .eq("id", studentId);

      loadStudents();
    }

    // 5. VIEW STUDENT LIST & POPULATE ELEMENTS
    async function loadStudents() {
      const { data, error } = await supabaseClient
        .from("students")
        .select("*");
      
      if (error) {
        console.error("Error fetching students:", error);
        return;
      }

      const tableBody = document.getElementById("studentTableBody");
      const studentSelect = document.getElementById("studentSelect");

      // Reset existing content
      tableBody.innerHTML = "";
      studentSelect.innerHTML = '<option value="">-- Select a Student --</option>';

      if (data) {
        data.forEach(s => {
          // Add row to the HTML Table with explicit Update and Delete actions passed via row ID
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.course ? s.course : "<em>Not Registered</em>"}</td>
            <td>
              <button onclick="updateCourse(${s.id}, '${s.course || ''}')">Update Course</button>
              <button onclick="deleteStudent(${s.id}, '${s.name}')">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);

          // Add option to the Dropdown Menu for registration
          const option = document.createElement("option");
          option.value = s.id; 
          option.innerText = s.name;
          studentSelect.appendChild(option);
        });
      }
    }
  </script>
</body>
</html>
