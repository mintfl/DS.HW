<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student System</title>
</head>
<body>

  <h2>Add New Student</h2>
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <button onclick="addStudent()">Add Student</button>

  <hr>

  <h2>Register Course for Student</h2>
  <select id="studentSelect">
    <option value="">-- Select a Student --</option>
  </select>
  <input id="courseName" placeholder="Course Name">
  <button onclick="registerCourse()">Register Course</button>

  <hr>

  <h2>Registered Students & Courses</h2>
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
      </tr>
    </thead>
    <tbody id="studentTableBody">
      </tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  
  <script>
    const supabaseClient = supabase.createClient("my URL", "my anon");

    window.onload = loadStudents;

    async function addStudent() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      if (!name || !email) {
        alert("Please fill in both name and email.");
        return;
      }

      // Inserts student with no course assigned yet
      await supabaseClient
        .from("students")
        .insert([{ name, email, course: null }]);

      // Clear input fields and refresh UI
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      loadStudents();
    }

    // 2. REGISTER COURSE
    async function registerCourse() {
      const studentId = document.getElementById("studentSelect").value;
      const courseName = document.getElementById("courseName").value;

      if (!studentId || !courseName) {
        alert("Please select a student and enter a course name.");
        return;
      }

      // Updates the existing student record with the course name
      await supabaseClient
        .from("students")
        .update({ course: courseName })
        .eq("id", studentId); // Assumes your table's primary key is named 'id'

      // Clear input field and refresh UI
      document.getElementById("courseName").value = "";
      loadStudents();
    }

    // 3. VIEW STUDENT LIST & POPULATE DROPDOWN
    async function loadStudents() {
      const { data, error } = await supabaseClient
        .from("students")
        .select("*");
      
      if (error) {
        console.error("Error fetching students:", error);
        return;
      }

      const tableBody = document.getElementById("studentTableBody");
      const studentSelect = document.getElementById("studentSelect");

      // Reset existing content
      tableBody.innerHTML = "";
      studentSelect.innerHTML = '<option value="">-- Select a Student --</option>';

      if (data) {
        data.forEach(s => {
          // Add row to the HTML Table
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.course ? s.course : "<em>Not Registered</em>"}</td>
          `;
          tableBody.appendChild(row);

          // Add option to the Dropdown Menu for registration
          const option = document.createElement("option");
          option.value = s.id; 
          option.innerText = s.name;
          studentSelect.appendChild(option);
        });
      }
    }
  </script>
</body>
</html>
